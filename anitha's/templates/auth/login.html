{% extends 'base.html' %}

{% block title %}Login – MediLens AI Medical Platform{% endblock %}

{% block content %}
<div class="container" style="max-width: 520px; margin: 40px auto;">
    <div class="card" style="box-shadow: var(--shadow-lg); padding: 36px 32px;">
        <div style="text-align: center; margin-bottom: 28px;">
            <div class="brand-icon" style="margin: 0 auto 14px auto;">
                <i class="fas fa-lock"></i>
            </div>
            <h2 style="font-size: 1.8rem; margin-bottom: 6px;">Welcome Back</h2>
            <p style="color: var(--text-muted); font-size: 0.92rem;">Sign in to access your MediLens AI diagnostic portal</p>
        </div>

        <!-- 1-Click Demo Accounts Selector -->
        <div style="background: var(--card-light-blue); border: 1px solid var(--card-light-blue-border); border-radius: var(--radius-md); padding: 14px; margin-bottom: 24px;">
            <div style="font-size: 0.82rem; font-weight: 700; color: var(--primary-navy); margin-bottom: 8px; display: flex; align-items: center; gap: 6px;">
                <i class="fas fa-magic" style="color: var(--secondary-teal);"></i> 1-Click Viva Demo Logins:
            </div>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button type="button" class="btn btn-sm btn-outline btn-demo-creds" 
                        data-email="patient@medilens.ai" data-password="Patient@123" data-role="patient"
                        style="background: #fff; font-size: 0.8rem;">
                    <i class="fas fa-user"></i> Patient
                </button>
                <button type="button" class="btn btn-sm btn-outline btn-demo-creds" 
                        data-email="dr.sharma@medilens.ai" data-password="Doctor@123" data-role="doctor"
                        style="background: #fff; font-size: 0.8rem;">
                    <i class="fas fa-user-md"></i> Doctor
                </button>
                <button type="button" class="btn btn-sm btn-outline btn-demo-creds" 
                        data-email="admin@medilens.ai" data-password="Admin@123" data-role="admin"
                        style="background: #fff; font-size: 0.8rem;">
                    <i class="fas fa-user-shield"></i> Admin
                </button>
            </div>
        </div>

        <form action="{{ url_for('auth.login') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="role"><i class="fas fa-id-badge"></i> Select Role</label>
                <select name="role" id="role" class="form-control">
                    <option value="patient">Patient (Self-Analysis & Records)</option>
                    <option value="doctor">Doctor / Radiologist (Clinical Review)</option>
                    <option value="admin">Administrator (System & Model Monitor)</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="email"><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" name="email" id="email" class="form-control" placeholder="name@domain.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password"><i class="fas fa-key"></i> Password</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <div style="margin-top: 24px;">
                <button type="submit" class="btn btn-teal" style="width: 100%; padding: 12px; font-size: 1rem;">
                    <i class="fas fa-sign-in-alt"></i> Sign In to Portal
                </button>
            </div>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account? <a href="{{ url_for('auth.register') }}" style="font-weight: 600;">Register as Patient or Doctor</a>
        </div>
    </div>
</div>
{% endblock %}
