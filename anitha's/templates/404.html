{% extends 'base.html' %}

{% block title %}Page Not Found (404) – MediLens AI{% endblock %}

{% block content %}
<div class="container" style="max-width: 540px; margin: 80px auto; text-align: center;">
    <div style="font-size: 5rem; font-weight: 800; color: #CBD5E1; line-height: 1;">404</div>
    <h2 style="font-size: 1.8rem; color: var(--primary-navy); margin: 16px 0 10px 0;">Medical Record or Page Not Found</h2>
    <p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 24px;">
        The requested URL or diagnostic report ID does not exist or may have been relocated.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-teal">
        <i class="fas fa-home"></i> Return to Homepage
    </a>
</div>
{% endblock %}
